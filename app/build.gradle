plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mcschummi.daylightlogger'
    compileSdk 34

    defaultConfig {
        applicationId "com.mcschummi.daylightlogger"
        minSdk 24          // Galaxy J3 (2017) ships with Android 7 (API 24)
        targetSdk 28       // matches the J3's last official Android (9 Pie),
                           // and avoids the tighter background limits of newer targets
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
