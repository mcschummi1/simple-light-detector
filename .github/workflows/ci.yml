name: CI

# Builds the debug APK on every push and pull request, so a compile error or
# broken resource can never land unnoticed. The APK is attached as a workflow
# artifact you can download and install directly.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaylightLogger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
